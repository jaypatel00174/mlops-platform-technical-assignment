[project]
name = "mlops-platform"
version = "0.1.0"
description = "MLOps control plane: model registry, governance, asynchronous deployments and monitoring"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2.1.9",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "import-linter>=2.17",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C4", "PT", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Domain errors are named for what happened (InvalidTransition, PolicyViolation), not "...Error".
"src/mlops/kernel/errors.py" = ["N818"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["mlops"]
plugins = ["pydantic.mypy"]

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib --cov=mlops --cov-report=term-missing:skip-covered"
markers = [
    "integration: needs a database (SQLite by default, PostgreSQL when TEST_DATABASE_URL is set)",
    "contract: shared contract tests that every adapter must pass",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["mlops"]

[tool.coverage.report]
fail_under = 85
show_missing = true

# --------------------------------------------------------------------------- import-linter
# Module boundaries from docs/adr/ADR-001: domain is pure, modules talk only through
# `application`, and each module is layered api > application | infrastructure > domain.
[tool.importlinter]
root_packages = ["mlops"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain code imports no framework or vendor SDK"
type = "forbidden"
source_modules = [
    "mlops.kernel",
    "mlops.registry.domain",
    "mlops.governance.domain",
    "mlops.deployment.domain",
    "mlops.monitoring.domain",
]
forbidden_modules = [
    "fastapi",
    "starlette",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "alembic",
    "psycopg",
    "httpx",
    "structlog",
]

[[tool.importlinter.contracts]]
name = "Kernel and platform do not depend on feature modules"
type = "forbidden"
source_modules = ["mlops.kernel", "mlops.platform"]
forbidden_modules = [
    "mlops.registry",
    "mlops.governance",
    "mlops.deployment",
    "mlops.monitoring",
]

[[tool.importlinter.contracts]]
name = "Registry reaches other modules only through their application layer"
type = "forbidden"
source_modules = ["mlops.registry"]
forbidden_modules = [
    "mlops.governance.domain", "mlops.governance.infrastructure", "mlops.governance.api",
    "mlops.deployment.domain", "mlops.deployment.infrastructure", "mlops.deployment.api",
    "mlops.monitoring.domain", "mlops.monitoring.infrastructure", "mlops.monitoring.api",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Governance reaches other modules only through their application layer"
type = "forbidden"
source_modules = ["mlops.governance"]
forbidden_modules = [
    "mlops.registry.domain", "mlops.registry.infrastructure", "mlops.registry.api",
    "mlops.deployment.domain", "mlops.deployment.infrastructure", "mlops.deployment.api",
    "mlops.monitoring.domain", "mlops.monitoring.infrastructure", "mlops.monitoring.api",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Deployment reaches other modules only through their application layer"
type = "forbidden"
source_modules = ["mlops.deployment"]
forbidden_modules = [
    "mlops.registry.domain", "mlops.registry.infrastructure", "mlops.registry.api",
    "mlops.governance.domain", "mlops.governance.infrastructure", "mlops.governance.api",
    "mlops.monitoring.domain", "mlops.monitoring.infrastructure", "mlops.monitoring.api",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Monitoring reaches other modules only through their application layer"
type = "forbidden"
source_modules = ["mlops.monitoring"]
forbidden_modules = [
    "mlops.registry.domain", "mlops.registry.infrastructure", "mlops.registry.api",
    "mlops.governance.domain", "mlops.governance.infrastructure", "mlops.governance.api",
    "mlops.deployment.domain", "mlops.deployment.infrastructure", "mlops.deployment.api",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Registry layers"
type = "layers"
layers = ["mlops.registry.api", "mlops.registry.application | mlops.registry.infrastructure", "mlops.registry.domain"]

[[tool.importlinter.contracts]]
name = "Governance layers"
type = "layers"
layers = ["mlops.governance.api", "mlops.governance.application | mlops.governance.infrastructure", "mlops.governance.domain"]

[[tool.importlinter.contracts]]
name = "Deployment layers"
type = "layers"
layers = ["mlops.deployment.api", "mlops.deployment.application | mlops.deployment.infrastructure", "mlops.deployment.domain"]

[[tool.importlinter.contracts]]
name = "Monitoring layers"
type = "layers"
layers = ["mlops.monitoring.api", "mlops.monitoring.application | mlops.monitoring.infrastructure", "mlops.monitoring.domain"]
